name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Xcode バージョンをハードコードせず、利用可能な最新の Xcode 16 系を選ぶ。
          # （このプロジェクトは Xcode 16 の file system synchronized group を使うため 16 以降が必須）
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          fi
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          # 機種名はハードコードせず、ランタイムに存在する iPhone シミュレータを動的に選ぶ。
          # （ランナーイメージ更新で機種が消えるため。過去の障害からの教訓）
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; ids=[x['udid'] for r in d for x in d[r] if x.get('isAvailable') and 'iPhone' in x['name']]; print(ids[0] if ids else '')")
          if [ -z "$UDID" ]; then
            echo "利用可能な iPhone シミュレータが見つかりません" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build & test on iOS Simulator
        run: |
          set -o pipefail
          # xcodebuild test はアプリ本体もテストホストとしてビルドするので、
          # これ1本でコンパイル検証とユニットテストの両方を兼ねる。
          xcodebuild test \
            -project Shiritori.xcodeproj \
            -scheme Shiritori \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
